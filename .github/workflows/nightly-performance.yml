name: Nightly Performance Baseline

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Memory and SQLite baselines
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Check P0 gate and print extended performance baseline
        run: bun run bench:perf
